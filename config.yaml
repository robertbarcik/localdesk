# LocalDesk Configuration
# Switch between "local" and "cloud" mode

mode: "cloud"

local:
  base_url: "http://localhost:11434/v1"
  model: "qwen3:1.7b"
  api_key: "not-needed"

cloud:
  base_url: "https://openrouter.ai/api/v1"
  model: "qwen/qwen3-30b-a3b"
  api_key: "${OPENROUTER_API_KEY}"

# OpenAI (background roles + voice). Missing key => roles fall back to the agent model.
openai:
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"

# Per-role model routing. provider "mode" follows the local/cloud switch above.
roles:
  agent:      { provider: mode }
  judge:      { provider: mode }   # override: { provider: openai, model: gpt-5.4-mini }
  sentinel:   { provider: openai, model: gpt-5.4-nano }
  writer:     { provider: openai, model: gpt-5.4-mini }
  audit_chat: { provider: openai, model: gpt-5.4-nano }
  voice:      { provider: openai, model: gpt-realtime-2.1-mini }

# Ops simulation + sentinel pacing
simulation:
  sentinel_cadence_s: 25
  max_events_per_min: 12

# Embedding model (always local via Ollama)
embedding:
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"

# ChromaDB
vectorstore:
  path: "./vectorstore"
  collection: "localdesk_kb"

# Database
database:
  path: "./data/db/localdesk.db"

# Audit logging
audit:
  path: "./logs/audit.jsonl"

# Server
server:
  host: "0.0.0.0"
  port: 7860
