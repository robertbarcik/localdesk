        function renderDashboard(d) {
            const total = d.total || 0;
            const byStatus = d.by_status || {};
            const byPriority = d.by_priority || {};
            const recent = d.recent || [];

            let html = '';

            /* Total */
            html += `<div class="dash-total">${total}</div>`;
            html += `<div class="dash-total-label">incidents</div>`;

            /* By status */
            html += '<div class="dash-section">';
            html += '<div class="dash-section-title">by status</div>';
            const statusOrder = ['open', 'escalated', 'resolved'];
            for (const s of statusOrder) {
                const count = byStatus[s] || 0;
                const pct = total > 0 ? (count / total * 100) : 0;
                const dotClass = `dash-dot-${s}`;
                html += `<div class="dash-row">
                    <span class="dash-dot ${dotClass}"></span>
                    <span class="dash-label">${s}</span>
                    <div class="dash-bar-bg"><div class="dash-bar-fill ${dotClass}" style="width:${pct}%"></div></div>
                    <span class="dash-count">${count}</span>
                </div>`;
            }
            /* Any other statuses */
            for (const [s, count] of Object.entries(byStatus)) {
                if (statusOrder.includes(s)) continue;
                const pct = total > 0 ? (count / total * 100) : 0;
                html += `<div class="dash-row">
                    <span class="dash-dot" style="background:rgba(255,255,255,0.3)"></span>
                    <span class="dash-label">${esc(s)}</span>
                    <div class="dash-bar-bg"><div class="dash-bar-fill" style="width:${pct}%;background:rgba(255,255,255,0.3)"></div></div>
                    <span class="dash-count">${count}</span>
                </div>`;
            }
            html += '</div>';

            /* By priority */
            html += '<div class="dash-section">';
            html += '<div class="dash-section-title">by priority</div>';
            const prioOrder = ['critical', 'high', 'medium', 'low'];
            for (const p of prioOrder) {
                const count = byPriority[p] || 0;
                const pct = total > 0 ? (count / total * 100) : 0;
                const dotClass = `dash-dot-${p}`;
                html += `<div class="dash-row">
                    <span class="dash-dot ${dotClass}"></span>
                    <span class="dash-label">${p}</span>
                    <div class="dash-bar-bg"><div class="dash-bar-fill ${dotClass}" style="width:${pct}%"></div></div>
                    <span class="dash-count">${count}</span>
                </div>`;
            }
            html += '</div>';

            /* Recent incidents */
            if (recent.length > 0) {
                html += '<div class="dash-section">';
                html += '<div class="dash-section-title">recent</div>';
                for (const r of recent) {
                    const badgeClass = `dash-badge-${r.priority || 'medium'}`;
                    html += `<div class="dash-recent-item">
                        <span class="dash-recent-id">${esc(r.ticket_id || '')}</span>
                        <span class="dash-badge ${badgeClass}">${esc(r.priority || '')}</span>
                        <br><span class="dash-recent-summary">${esc(r.summary || '')}</span>
                    </div>`;
                }
                html += '</div>';
            }

            dashContent.innerHTML = html;
        }

        /* ── Audio system (Web Audio API) ── */
        let audioCtx = null;
        let audioMuted = localStorage.getItem('mu-audio-muted') === 'true';

        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playTone(freq, duration, startTime, gainVal) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(gainVal, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playSecuritySound(level) {
            if (audioMuted) return;
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;
                if (level === 'PASS' || level === 'pass') {
                    playTone(523, 0.15, now, 0.12);
                    playTone(659, 0.2, now + 0.1, 0.12);
                } else if (level === 'FLAG' || level === 'flag') {
                    playTone(440, 0.3, now, 0.1);
                } else {
                    playTone(165, 0.2, now, 0.15);
                    playTone(131, 0.3, now + 0.15, 0.15);
                }
            } catch (e) { /* audio not available */ }
        }

        function toggleAudioMute() {
            audioMuted = !audioMuted;
            localStorage.setItem('mu-audio-muted', audioMuted);
            document.getElementById('audio-toggle').textContent = audioMuted ? '\u{1F509}' : '\u{1F50A}';
        }
        document.getElementById('audio-toggle').textContent = audioMuted ? '\u{1F509}' : '\u{1F50A}';

        /* ── Dark mode ── */
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('mu-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').textContent = isDark ? '\u2600' : '\u263D';
            renderMonitor();
        }

        (function initTheme() {
            const saved = localStorage.getItem('mu-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.body.classList.add('dark');
                document.getElementById('theme-toggle').textContent = '\u2600';
            }
        })();

        /* ── Demo mode ── */
        const DEMO_SCRIPT = [
            { query: "My VPN keeps disconnecting when I switch to WiFi, what should I do?", delay: 5000 },
            { query: "What's the guaranteed response time for a critical issue on the Gold SLA tier?", delay: 5000 },
            { query: "Can you check what equipment is assigned to EMP-008?", delay: 5000 },
            { query: "I need to report a high priority incident — our email server in building B is down and 50 users are affected. Reporter is John Smith.", delay: 5000 },
        ];
        let demoRunning = false;
        let demoAbort = false;

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function startDemo() {
            if (demoRunning) return;
            demoRunning = true;
            demoAbort = false;

            const indicator = document.createElement('div');
            indicator.id = 'demo-indicator';
            indicator.textContent = 'DEMO';
            document.body.appendChild(indicator);

            const cx = window.innerWidth / 2 - THREAD_WIDTH / 2;
            spawnThread(cx + window.scrollX, 60 + window.scrollY);
            const threadId = activeThreadId;

            for (let i = 0; i < DEMO_SCRIPT.length; i++) {
                if (demoAbort) break;
                const step = DEMO_SCRIPT[i];

                await sleep(1200);
                if (demoAbort) break;

                const inp = document.getElementById(`input-${threadId}`);
                if (!inp) break;
                inp.value = '';
                for (let c = 0; c < step.query.length; c++) {
                    if (demoAbort) break;
                    inp.value += step.query[c];
                    await sleep(30 + Math.random() * 30);
                }
                if (demoAbort) break;

                await sendMessage(threadId);

                while (threads[threadId] && threads[threadId].isProcessing) {
                    await sleep(200);
                    if (demoAbort) break;
                }
                if (demoAbort) break;

                await sleep(step.delay);
            }

            demoRunning = false;
            const ind = document.getElementById('demo-indicator');
            if (ind) ind.remove();
        }

        function stopDemo() { demoAbort = true; }

        /* ── Global keyboard shortcuts ── */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (demoRunning) stopDemo();
                if (dashOpen) toggleDashboard();
                closeSecurityPanel();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                if (demoRunning) stopDemo(); else startDemo();
            }
        });

        /* ══════════════════ OPS ROOM ══════════════════ */

        /* ── Ops state ── */
        let simRunning = false;
        let voiceAvailable = false;
        const simToggleBtn = document.getElementById('sim-toggle');
        const voiceOrb = document.getElementById('voice-orb');

        function initOpsState(status) {
            voiceAvailable = !!status.voice_available;
            voiceOrb.classList.toggle('disabled', !voiceAvailable);
            voiceOrb.title = voiceAvailable
                ? 'Voice mode — talk to the desk'
                : 'Voice needs OPENAI_API_KEY in .env';
            setSimState(!!status.simulation_running);
        }

        function setSimState(running) {
            simRunning = running;
            simToggleBtn.classList.toggle('active', running);
            simToggleBtn.innerHTML = running ? '&#9724;' : '&#9654;';
        }

        /* ── WebSocket client ── */
        let ws = null;
        let wsRetryMs = 1000;

        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => { wsRetryMs = 1000; };
            ws.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch (err) { return; }
                handleServerPush(msg);
            };
            ws.onclose = () => {
                setTimeout(connectWS, wsRetryMs);
                wsRetryMs = Math.min(wsRetryMs * 2, 10000);
            };
            ws.onerror = () => ws.close();
        }
        connectWS();
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping');
        }, 25000);

        function handleServerPush(msg) {
            const d = msg.data || {};
            switch (msg.type) {
                case 'telemetry_tick':   onTelemetry(d); break;
                case 'incident_created': onIncidentCreated(d); break;
                case 'sentinel_message': onSentinelMessage(d); break;
                case 'chart_update':     onChartUpdate(d); break;
                case 'sim_state':        setSimState(!!d.running); break;
            }
        }

        /* ── Ambient telemetry ── */
        const telemetryLayer = document.getElementById('telemetry-layer');
        const tickerEl = document.getElementById('ticker');
        let tickerTimer = null;
        let eventCounter = 0;

        function onTelemetry(ev) {
            eventCounter++;

            /* Blip at a random spot (kept away from screen center) */
            if (telemetryLayer.childElementCount < 40) {
                const blip = document.createElement('div');
                blip.className = `telemetry-blip blip-${ev.severity || 'info'}`;
                let bx = 5 + Math.random() * 90;
                let by = 8 + Math.random() * 80;
                if (bx > 30 && bx < 70 && by > 30 && by < 65) bx = bx < 50 ? bx - 25 : bx + 25;
                blip.style.left = bx + 'vw';
                blip.style.top = by + 'vh';
                blip.addEventListener('animationend', () => blip.remove());
                telemetryLayer.appendChild(blip);
            }

            /* Ticker line */
            const t = (ev.ts || '').substring(11, 19);
            tickerEl.innerHTML = `<span class="tick-sev-${esc(ev.severity || 'info')}">●</span> ${esc(t)} · ${esc(ev.message || '')}`;
            tickerEl.classList.add('visible');
            if (tickerTimer) clearTimeout(tickerTimer);
            tickerTimer = setTimeout(() => tickerEl.classList.remove('visible'), 9000);

            if (chartsOpen) chartCounters.eventsSinceRefresh++;
        }

        function onIncidentCreated(inc) {
            if (!audioMuted) {
                try {
                    const now = getAudioCtx().currentTime;
                    playTone(392, 0.12, now, 0.06);
                } catch (e) { /* no audio */ }
            }
            const t = (inc.ticket_id || '');
            tickerEl.innerHTML = `<span class="tick-sev-warning">◆</span> ticket ${esc(t)} filed · ${esc(inc.summary || '')}`;
            tickerEl.classList.add('visible');
            if (dashOpen) loadDashboard();
        }

        /* ── Sentinel materialization ── */
        function onSentinelMessage(d) {
            if (!audioMuted) {
                try {
                    const now = getAudioCtx().currentTime;
                    playTone(660, 0.14, now, 0.10);
                    playTone(880, 0.22, now + 0.12, 0.10);
                } catch (e) { /* no audio */ }
            }
            /* Materialize on the right side, stacked below previous sentinel threads */
            const sentinelCount = Object.values(threads).filter(t => t.kind === 'sentinel').length;
            const x = Math.max(20, window.innerWidth - THREAD_WIDTH - 60);
            const y = 70 + sentinelCount * 140;
            const threadId = spawnThread(x + window.scrollX, y + window.scrollY, {
                sessionId: d.session_id,
                kind: 'sentinel',
                label: d.headline || 'sentinel alert',
                severity: d.severity,
            });
            addMessage(threadId, 'assistant', (d.headline ? d.headline + ' — ' : '') + (d.text || ''));
        }

        /* ── Simulation toggle ── */
        async function toggleSimulation(e) {
            if (e && e.shiftKey) {
                await fetch('/api/simulation/storm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kind: 'vpn_outage' }),
                });
                return;
            }
            const url = simRunning ? '/api/simulation/stop' : '/api/simulation/start';
            try {
                const res = await fetch(url, { method: 'POST' });
                const d = await res.json();
                setSimState(!!d.running);
            } catch (err) { /* server will push sim_state anyway */ }
        }

        /* ── Charts panel ── */
        const chartsPanel = document.getElementById('charts-panel');
        const chartsToggle = document.getElementById('charts-toggle');
        const chartsContent = document.getElementById('charts-content');
        let chartsOpen = false;
        let chartsInterval = null;
        let radarInterval = null;
        let radarData = { tickets: [], fetchedAt: 0 };
        let costData = null;
        const chartCounters = { eventsSinceRefresh: 0 };

        function toggleCharts() {
            chartsOpen = !chartsOpen;
            chartsPanel.classList.toggle('open', chartsOpen);
            chartsToggle.classList.toggle('active', chartsOpen);
            if (chartsOpen) {
                refreshCharts();
                chartsInterval = setInterval(refreshCharts, 10000);
                radarInterval = setInterval(renderRadarTimes, 1000);
            } else {
                clearInterval(chartsInterval);
                clearInterval(radarInterval);
            }
        }

        async function refreshCharts() {
            try {
                const [tl, gr, radar, cost] = await Promise.all([
                    fetch('/api/metrics/timeline?minutes=60&bucket=5').then(r => r.json()),
                    fetch('/api/metrics/guardrails?hours=24').then(r => r.json()),
                    fetch('/api/metrics/sla-radar').then(r => r.json()),
                    fetch('/api/metrics/costs?minutes=240').then(r => r.json()),
                ]);
                radarData = { tickets: radar.tickets || [], fetchedAt: Date.now() };
                costData = cost;
                renderCharts(tl, gr);
            } catch (e) {
                chartsContent.innerHTML = '<div class="dash-empty">could not load metrics</div>';
            }
        }

        function renderCharts(tl, gr) {
            let html = '';

            /* 1 — activity over time */
            html += '<div class="chart-card">';
            html += '<div class="chart-title"><span>activity · 60 min</span><span class="chart-note">events + incidents</span></div>';
            html += renderTimelineChart(tl.buckets || []);
            html += '</div>';

            /* 2 — guardrail triggers */
            html += '<div class="chart-card">';
            html += `<div class="chart-title"><span>guardrails · 24 h</span><span class="chart-note">${gr.total_interactions || 0} interactions</span></div>`;
            html += renderGuardrailBars(gr.counts || {});
            html += '</div>';

            /* 3 — SLA radar */
            html += '<div class="chart-card">';
            html += `<div class="chart-title"><span>sla radar</span><span class="chart-note">${radarData.tickets.length} open</span></div>`;
            html += '<div id="radar-rows"></div>';
            html += '</div>';

            /* 4 — cost meter */
            html += '<div class="chart-card">';
            html += '<div class="chart-title"><span>llm spend · 4 h</span><span class="chart-note">live</span></div>';
            html += '<div id="cost-card"></div>';
            html += '</div>';

            chartsContent.innerHTML = html;
            renderRadarTimes();
            renderCostCard();
        }

        function renderTimelineChart(buckets) {
            if (!buckets.length) return '<div class="dash-empty">no activity yet</div>';
            const w = 300, h = 74, pad = 4, padB = 14;
            const maxV = Math.max(1, ...buckets.map(b => Math.max(b.events, b.incidents)));
            const x = i => pad + (i / Math.max(1, buckets.length - 1)) * (w - pad * 2);
            const y = v => pad + (1 - v / maxV) * (h - pad - padB);

            const evPts = buckets.map((b, i) => `${x(i).toFixed(1)},${y(b.events).toFixed(1)}`).join(' ');
            const incPts = buckets.map((b, i) => `${x(i).toFixed(1)},${y(b.incidents).toFixed(1)}`).join(' ');
            const incArea = `${pad},${(h - padB).toFixed(1)} ${incPts} ${(w - pad).toFixed(1)},${(h - padB).toFixed(1)}`;

            const fmt = t => {
                const dt = new Date(t * 1000);
                return dt.getHours().toString().padStart(2, '0') + ':' + dt.getMinutes().toString().padStart(2, '0');
            };
            return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">
                <line x1="${pad}" y1="${h - padB}" x2="${w - pad}" y2="${h - padB}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                <polygon points="${incArea}" fill="rgba(224,96,80,0.16)"/>
                <polyline points="${evPts}" fill="none" stroke="rgba(122,158,201,0.75)" stroke-width="1.4" stroke-linejoin="round"/>
                <polyline points="${incPts}" fill="none" stroke="rgba(224,96,80,0.85)" stroke-width="1.4" stroke-linejoin="round"/>
                <text x="${pad}" y="${h - 2}" class="chart-axis-label">${fmt(buckets[0].t)}</text>
                <text x="${w - pad}" y="${h - 2}" text-anchor="end" class="chart-axis-label">${fmt(buckets[buckets.length - 1].t)}</text>
                <text x="${w - pad}" y="${pad + 7}" text-anchor="end" class="chart-axis-label">max ${maxV}</text>
            </svg>`;
        }

        const GUARDRAIL_LABELS = {
            injection: 'injection attempts', input_blocked: 'input blocked',
            pii_redacted: 'pii redacted (in)', pii_output: 'pii leak (out)',
            hallucinated_sla: 'sla hallucination', judge_flag: 'judge flagged',
            judge_block: 'judge blocked', authorized_disclosure: 'authorized disclosure',
            bypassed_realtime: 'voice · no guardrails',
        };
        const GUARDRAIL_COLORS = {
            injection: '#e06050', input_blocked: '#e06050', pii_redacted: '#e8a040',
            pii_output: '#e06050', hallucinated_sla: '#e8a040', judge_flag: '#d4c55a',
            judge_block: '#e06050', authorized_disclosure: '#5a9a5e', bypassed_realtime: '#8a6ab8',
        };

        function renderGuardrailBars(counts) {
            const entries = Object.entries(counts).filter(([, v]) => v > 0);
            if (!entries.length) return '<div class="dash-empty">no triggers — quiet shift</div>';
            const maxV = Math.max(...entries.map(([, v]) => v));
            let html = '';
            for (const [key, v] of entries) {
                const pct = (v / maxV * 100).toFixed(0);
                const color = GUARDRAIL_COLORS[key] || 'rgba(255,255,255,0.4)';
                html += `<div class="dash-row">
                    <span class="dash-label">${GUARDRAIL_LABELS[key] || esc(key)}</span>
                    <div class="dash-bar-bg"><div class="dash-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                    <span class="dash-count">${v}</span>
                </div>`;
            }
            return html;
        }

        function fmtRemaining(secs) {
            const neg = secs < 0;
            let s = Math.abs(secs);
            let out;
            if (s >= 86400) out = Math.floor(s / 86400) + 'd ' + Math.floor((s % 86400) / 3600) + 'h';
            else if (s >= 3600) out = Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
            else out = Math.floor(s / 60) + 'm ' + Math.floor(s % 60) + 's';
            return (neg ? '−' : '') + out;
        }

        function renderRadarTimes() {
            const rows = document.getElementById('radar-rows');
            if (!rows) return;
            const elapsed = (Date.now() - radarData.fetchedAt) / 1000;
            const tickets = radarData.tickets.slice(0, 8);
            if (!tickets.length) { rows.innerHTML = '<div class="dash-empty">no open tickets</div>'; return; }
            let html = '';
            for (const t of tickets) {
                const remaining = t.seconds_remaining - elapsed;
                const breached = remaining < 0;
                /* bar width: fraction of a 24h horizon still left */
                const frac = Math.max(0, Math.min(1, remaining / 86400));
                const cls = breached ? 'radar-breached' : frac < 0.25 ? 'radar-warning' : 'radar-ok';
                html += `<div class="radar-row" title="${esc(t.summary || '')} (${esc(t.tier)} / ${esc(t.priority)})">
                    <span class="radar-id">${esc(t.ticket_id)}</span>
                    <div class="radar-bar-bg"><div class="radar-bar ${cls}" style="width:${breached ? 100 : Math.max(3, frac * 100)}%"></div></div>
                    <span class="radar-time${breached ? ' breached' : ''}">${fmtRemaining(remaining)}</span>
                </div>`;
            }
            rows.innerHTML = html;
        }

        function renderCostCard() {
            const card = document.getElementById('cost-card');
            if (!card || !costData) return;
            const total = costData.total_usd || 0;
            const roles = costData.by_role || {};
            let html = `<div class="cost-total">$${total.toFixed(4)}</div>`;
            html += `<div class="cost-sub">${(costData.total_tokens || 0).toLocaleString()} tokens</div>`;
            for (const [role, e] of Object.entries(roles)) {
                html += `<div class="cost-row">
                    <span>${esc(role)} · ${esc((e.models && e.models[e.models.length-1] || '').split('/').pop())}</span>
                    <span class="cost-val">${e.calls} calls · $${e.cost_usd.toFixed(4)}</span>
                </div>`;
            }
            card.innerHTML = html;
        }

        function onChartUpdate(d) {
            if (d.kind !== 'cost' || !costData) return;
            costData.total_usd = (costData.total_usd || 0) + (d.cost_usd || 0);
            costData.total_tokens = (costData.total_tokens || 0) + (d.tokens || 0);
            const e = costData.by_role[d.role] || (costData.by_role[d.role] = { tokens: 0, cost_usd: 0, calls: 0, models: [d.model] });
            e.tokens += d.tokens || 0;
            e.cost_usd += d.cost_usd || 0;
            e.calls += 1;
            if (chartsOpen) renderCostCard();
        }

        /* ── Reports panel ── */
        const reportPanel = document.getElementById('report-panel');
        const reportToggle = document.getElementById('report-toggle');
        const reportContent = document.getElementById('report-content');
        let reportsOpen = false;

        function toggleReports() {
            reportsOpen = !reportsOpen;
            reportPanel.classList.toggle('open', reportsOpen);
            reportToggle.classList.toggle('active', reportsOpen);
        }

        function setReportBusy(which) {
            document.getElementById('report-btn-handover').classList.toggle('active', which === 'handover');
            document.getElementById('report-btn-clusters').classList.toggle('active', which === 'clusters');
            reportContent.innerHTML = '<div class="status-shimmer" style="text-align:center;padding:16px 0">'
                + (which === 'handover' ? 'writing the handover briefing' : 'clustering open tickets') + '</div>';
        }

        async function loadHandover() {
            setReportBusy('handover');
            try {
                const res = await fetch('/api/reports/handover', { method: 'POST' });
                const d = await res.json();
                if (d.error) throw new Error(d.error);
                reportContent.innerHTML = renderMd(d.markdown || '')
                    + `<div class="report-meta">${esc(d.model || '')} · ${esc((d.generated_at || '').substring(11, 19))} utc</div>`;
            } catch (e) {
                reportContent.innerHTML = '<div class="dash-empty">could not generate handover</div>';
            }
        }

        async function loadClusters() {
            setReportBusy('clusters');
            try {
                const res = await fetch('/api/reports/clusters', { method: 'POST' });
                const d = await res.json();
                if (d.error) throw new Error(d.error);
                const clusters = d.clusters || [];
                if (!clusters.length) {
                    reportContent.innerHTML = '<div class="dash-empty">no related-ticket clusters found</div>';
                    return;
                }
                let html = '';
                for (const c of clusters) {
                    html += `<div class="cluster-card">
                        <div class="cluster-label">${esc(c.label || 'cluster')}</div>
                        <div class="cluster-cause">${esc(c.root_cause || '')}</div>
                        <div>${(c.tickets || []).map(t => `<span class="cluster-chip">${esc(t)}</span>`).join('')}</div>
                    </div>`;
                }
                if (d.singletons && d.singletons.length) {
                    html += `<div class="cluster-cause" style="margin-top:8px">unclustered: ${d.singletons.map(esc).join(', ')}</div>`;
                }
                html += `<div class="report-meta">${esc(d.model || '')}</div>`;
                reportContent.innerHTML = html;
            } catch (e) {
                reportContent.innerHTML = '<div class="dash-empty">could not cluster tickets</div>';
            }
        }

        /* ── Ask-the-audit meta-chat ── */
        const AUDIT_HINTS = [
            'How many injection attempts today?',
            'What did the judge block this week, and why?',
            'Any PII incidents in the last 24 hours?',
            'Summarize guardrail activity for today',
            'Which interactions bypassed the guardrails?',
        ];

        function openAuditThread(e) {
            const x = window.innerWidth / 2 - THREAD_WIDTH / 2 + (Math.random() * 60 - 30);
            const y = window.innerHeight * 0.25;
            const threadId = spawnThread(x + window.scrollX, y + window.scrollY, {
                kind: 'audit',
                label: 'ask the audit log',
                sessionId: 'audit-' + Date.now(),
            });
            addMessage(threadId, 'assistant',
                "I answer questions about this system's own audit trail — guardrail triggers, blocked requests, judge verdicts, tool usage. What would you like to know?");
        }

        async function sendAuditMessage(threadId) {
            const thread = threads[threadId];
            if (!thread) return;
            const inp = document.getElementById(`input-${threadId}`);
            const text = inp.value.trim();
            if (!text || thread.isProcessing) return;

            thread.isProcessing = true;
            inp.value = '';
            inp.disabled = true;
            addMessage(threadId, 'user', text);
            showStatus(threadId);

            try {
                const res = await fetch('/api/audit-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: thread.conversationId }),
                });
                const d = await res.json();
                removeStatus(threadId);
                addMessage(threadId, 'assistant', d.response || d.error || 'No answer.');
            } catch (err) {
                removeStatus(threadId);
                addMessage(threadId, 'assistant', 'Could not reach the audit service.');
            }
            thread.isProcessing = false;
            inp.disabled = false;
            inp.focus();
        }

        /* ── Voice mode (OpenAI Realtime over WebRTC) ── */
        const voiceHint = document.getElementById('voice-hint');
        const voiceTools = document.getElementById('voice-tools');
        const voiceAudio = document.getElementById('voice-audio');
        let voicePC = null;
        let voiceDC = null;
        let voiceMicStream = null;
        let voiceLive = false;
        let voiceSessionId = null;
        let ampRAF = null;

        function setVoiceHint(text, sticky) {
            voiceHint.textContent = text || '';
            voiceHint.classList.toggle('visible', !!text);
            if (text && !sticky) setTimeout(() => voiceHint.classList.remove('visible'), 4000);
        }

        async function toggleVoice() {
            if (!voiceAvailable) {
                setVoiceHint('voice needs an openai key in .env');
                return;
            }
            if (voiceLive) { stopVoice(); return; }
            await startVoice();
        }

        async function startVoice() {
            voiceOrb.classList.add('connecting');
            setVoiceHint('connecting…', true);
            voiceSessionId = 'voice-' + Date.now();
            try {
                /* 1 — ephemeral client secret from our backend */
                const sess = await fetch('/api/voice/session', { method: 'POST' }).then(r => {
                    if (!r.ok) throw new Error('session mint failed: ' + r.status);
                    return r.json();
                });
                const ek = sess.value;
                const model = sess.model || 'gpt-realtime-2.1-mini';

                /* 2 — WebRTC peer connection with mic + data channel */
                voicePC = new RTCPeerConnection();
                voiceMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                voiceMicStream.getTracks().forEach(t => voicePC.addTrack(t, voiceMicStream));
                voicePC.ontrack = (e) => {
                    voiceAudio.srcObject = e.streams[0];
                    startAmpMeter(e.streams[0]);
                };
                voiceDC = voicePC.createDataChannel('oai-events');
                voiceDC.onmessage = (e) => {
                    try { handleRealtimeEvent(JSON.parse(e.data)); } catch (err) { /* skip */ }
                };

                /* 3 — SDP exchange straight with OpenAI */
                const offer = await voicePC.createOffer();
                await voicePC.setLocalDescription(offer);
                const sdpRes = await fetch(
                    'https://api.openai.com/v1/realtime/calls?model=' + encodeURIComponent(model), {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + ek, 'Content-Type': 'application/sdp' },
                        body: offer.sdp,
                    });
                if (!sdpRes.ok) throw new Error('sdp exchange failed: ' + sdpRes.status);
                await voicePC.setRemoteDescription({ type: 'answer', sdp: await sdpRes.text() });

                voiceLive = true;
                voiceOrb.classList.remove('connecting');
                voiceOrb.classList.add('live');
                setVoiceHint('listening · guardrails bypassed on this channel', true);
            } catch (err) {
                stopVoice();
                setVoiceHint('voice unavailable — ' + (err.message || 'connection failed'));
            }
        }

        function stopVoice() {
            voiceLive = false;
            if (ampRAF) cancelAnimationFrame(ampRAF);
            voiceOrb.style.setProperty('--amp', 0);
            if (voiceDC) { try { voiceDC.close(); } catch (e) {} voiceDC = null; }
            if (voicePC) { try { voicePC.close(); } catch (e) {} voicePC = null; }
            if (voiceMicStream) {
                voiceMicStream.getTracks().forEach(t => t.stop());
                voiceMicStream = null;
            }
            voiceAudio.srcObject = null;
            voiceOrb.classList.remove('connecting', 'live', 'speaking');
            voiceTools.innerHTML = '';
            voiceHint.classList.remove('visible');
        }

        function startAmpMeter(stream) {
            try {
                const ctx = getAudioCtx();
                const src = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 256;
                src.connect(analyser);
                const buf = new Uint8Array(analyser.frequencyBinCount);
                (function tick() {
                    if (!voiceLive) return;
                    analyser.getByteFrequencyData(buf);
                    let sum = 0;
                    for (let i = 0; i < buf.length; i++) sum += buf[i];
                    const amp = Math.min(1, (sum / buf.length) / 90);
                    voiceOrb.style.setProperty('--amp', amp.toFixed(2));
                    voiceOrb.classList.toggle('speaking', amp > 0.12);
                    ampRAF = requestAnimationFrame(tick);
                })();
            } catch (e) { /* meter is cosmetic */ }
        }

        function showToolChip(name) {
            const chip = document.createElement('div');
            chip.className = 'voice-tool-chip';
            chip.textContent = '⚙ ' + name;
            voiceTools.appendChild(chip);
            setTimeout(() => chip.remove(), 6000);
        }

        async function handleRealtimeEvent(ev) {
            switch (ev.type) {
                case 'input_audio_buffer.speech_started':
                    voiceOrb.classList.remove('speaking');
                    break;
                case 'conversation.item.input_audio_transcription.completed':
                    if (ev.transcript) logVoiceTranscript('user', ev.transcript);
                    break;
                case 'response.output_audio_transcript.done':
                case 'response.audio_transcript.done':
                    if (ev.transcript) logVoiceTranscript('assistant', ev.transcript);
                    break;
                case 'response.done': {
                    const items = (ev.response && ev.response.output) || [];
                    for (const item of items) {
                        if (item.type === 'function_call') await runVoiceTool(item);
                    }
                    break;
                }
            }
        }

        async function runVoiceTool(item) {
            showToolChip(item.name);
            let output = '{"error": "tool execution failed"}';
            try {
                const res = await fetch('/api/voice/tool', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: item.name,
                        arguments: item.arguments,
                        call_id: item.call_id,
                        session_id: voiceSessionId,
                    }),
                });
                const d = await res.json();
                if (d.output) output = d.output;
            } catch (e) { /* keep error output */ }
            if (voiceDC && voiceDC.readyState === 'open') {
                voiceDC.send(JSON.stringify({
                    type: 'conversation.item.create',
                    item: { type: 'function_call_output', call_id: item.call_id, output },
                }));
                voiceDC.send(JSON.stringify({ type: 'response.create' }));
            }
        }

        function logVoiceTranscript(role, transcript) {
            fetch('/api/voice/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role, transcript, session_id: voiceSessionId }),
            }).catch(() => {});
        }
    </script>
</body>
